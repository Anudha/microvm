[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microvm"
version = "0.1.0"
description = "Run multiple Chromium-family browsers in fully isolated mini-VMs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "microvm contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
# Zero runtime deps on purpose. stdlib-only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
microvm = "microvm.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["microvm*"]
